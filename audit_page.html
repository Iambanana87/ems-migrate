  <script>
  (function(){
    // ---- MUST RUN ASAP (no defer) ----
    function getToken(){
      try {
        let t = localStorage.getItem('ems_token') || '';
        if (!t) {
          const m = document.cookie.match(/(?:^|;\s*)ems_token=([^;]+)/);
          if (m) t = decodeURIComponent(m[1]);
        }
        return t || '';
      } catch { return ''; }
    }
    function goLogin(){
      // Chỉ gửi path+query+hash (tránh bị server chặn absolute URL)
      var ret = encodeURIComponent(location.pathname + location.search + location.hash);
      location.replace('backend/login.php?return=' + ret);
    }
    // Nếu chưa có token -> về login
    var t = getToken();
    if (!t) { goLogin(); return; }

    // Expose helpers cho phần dưới dùng lại
    window.__EMS_GET_TOKEN__ = getToken;
    window.__EMS_GO_LOGIN__  = goLogin;

    // Wrapper fetch: tự gắn Authorization và xử lý 401
    window.authFetch = async function(url, opts = {}){
      const headers = { ...(opts.headers || {}) };
      const tok = getToken();
      if (tok) headers.Authorization = 'Bearer ' + tok;
      const res = await fetch(url, { ...opts, headers, credentials: 'include', cache: 'no-store' });
      if (res.status === 401) {
        try {
          const j = await res.clone().json();
          if (j && j.redirect) { location.replace(j.redirect); return res; }
        } catch {}
        goLogin();
        throw new Error('Unauthorized');
      }
      return res;
    };
  })();
  </script>

  <script>
    // ====== CONFIG ======
    const API_BASE = 'http://192.168.110.2/web_develop/ems/model/get_audit_trail.php';

    // Limits
    const PAGE_SIZE   = 100;
    const MAX_RENDER  = 200;

    // Search in diff when query starts with 'diff:'
    const SEARCH_DIFF_PREFIX = 'diff:';

    // Formatters
    const FMT_DATE     = new Intl.DateTimeFormat('en-US', { weekday:'long', year:'numeric', month:'short', day:'numeric' });
    const FMT_TIME     = new Intl.DateTimeFormat('en-US', { hour:'2-digit', minute:'2-digit' });
    const FMT_DATETIME = new Intl.DateTimeFormat('en-US', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });

    // Utils
    const esc = (s) => (s === null || s === undefined) ? '' :
      String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

    const parseMysql = (s) => {
      if (!s) return new Date(NaN);
      return new Date(s.replace(' ', 'T'));
    };

    const shortId = (id, n = 8) => {
      const s = String(id || '');
      return s.length > n ? s.slice(0, n) + '…' : s;
    };

    // ===== Global State =====
    let activeTab = 'timeline';
    let sidebarVisible = false;
    let modalVisible = false;
    let selectedAction = null;

    let actions = [];
    let filteredActions = [];
    let actionMap = new Map();

    // ===== API helpers (authFetch có sẵn trong dự án của bạn) =====
    async function apiList(params = {}) {
      const url = new URL(API_BASE);
      url.searchParams.set('mode', 'list');
      url.searchParams.set('page', params.page ?? 1);
      url.searchParams.set('page_size', params.page_size ?? PAGE_SIZE);
      url.searchParams.set('sort', params.sort ?? 'desc');
      if (params.type) url.searchParams.set('type', params.type);
      if (params.q)    url.searchParams.set('q', params.q);
      if (params.who)  url.searchParams.set('who', params.who);
      if (params.from) url.searchParams.set('from', params.from);
      if (params.to)   url.searchParams.set('to', params.to);

      const res = await authFetch(url.toString());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data.status !== 'success') throw new Error(data.message || 'API error');
      return data;
    }

    async function apiOne(id) {
      const url = new URL(API_BASE);
      url.searchParams.set('mode', 'one');
      url.searchParams.set('id', id);
      const res = await authFetch(url.toString());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data.status !== 'success') throw new Error(data.message || 'API error');
      return data.item;
    }

    // ===== Filters (UI state) =====
    let filterAction = '';
    let specificDate = true;
    let dateSingle = '';
    let dateFrom = '';
    let dateTo = '';
    let searchQuery = '';

    function readFiltersFromUI() {
      filterAction = document.getElementById('filter-action').value;
      searchQuery = document.getElementById('search-query').value.trim();
      specificDate = document.getElementById('specific-date').checked;
      dateSingle = document.getElementById('date-single').value;
      dateFrom = document.getElementById('date-from').value;
      dateTo = document.getElementById('date-to').value;
      return { filterAction, searchQuery, specificDate, dateSingle, dateFrom, dateTo };
    }

    function buildApiParamsFromFilters() {
      const p = { page: 1, page_size: 300, sort: 'desc' };
      if (filterAction) p.type = filterAction;

      if (specificDate && dateSingle) {
        p.from = dateSingle + ' 00:00:00';
        p.to   = dateSingle + ' 23:59:59';
      } else if (!specificDate && dateFrom && dateTo) {
        p.from = dateFrom + ' 00:00:00';
        p.to   = dateTo + ' 23:59:59';
      }

      if (searchQuery) p.q = searchQuery;
      return p;
    }

    function clientFilter(list) {
      if (!searchQuery) return list;

      const q = searchQuery.toLowerCase();
      const searchDiff = q.startsWith(SEARCH_DIFF_PREFIX);
      const needle = searchDiff ? q.slice(SEARCH_DIFF_PREFIX.length).trim() : q;

      return list.filter(a => {
        const hitMeta =
          (a.reason || '').toLowerCase().includes(needle) ||
          (a.who || '').toLowerCase().includes(needle) ||
          String(a.id || '').toLowerCase().includes(needle);

        if (hitMeta) return true;
        if (!searchDiff || !needle) return false;

        if (!a._diffText) {
          try {
            a._diffText = JSON.stringify(a.diff ?? {}).toLowerCase().slice(0, 5000);
          } catch { a._diffText = ''; }
        }
        return a._diffText.includes(needle);
      });
    }

    // ===== Rendering helpers =====
    function getStats(arr) {
      const creates = arr.filter(a => a.type === 'create').length;
      const updates = arr.filter(a => a.type === 'update').length;
      const deletes = arr.filter(a => a.type === 'delete').length;
      return { creates, updates, deletes, total: arr.length };
    }

    function groupByDate(arr) {
      const groups = {};
      arr.forEach(a => {
        const key = String(a.created_at).slice(0, 10);
        groups[key] = groups[key] || [];
        groups[key].push(a);
      });
      const sortedKeys = Object.keys(groups).sort((a,b) => new Date(b) - new Date(a));
      const out = {};
      sortedKeys.forEach(k => {
        out[k] = groups[k].sort((x, y) => parseMysql(y.created_at) - parseMysql(x.created_at));
      });
      return out;
    }

    function isMediaImage(key) { return (key || '').toLowerCase().includes('image'); }
    function isMediaVideo(key) { return (key || '').toLowerCase().includes('video'); }

    function formatDate(dateStr) {
      const d = parseMysql(dateStr);
      return isNaN(d) ? dateStr : d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
    }
    function formatTime(dateStr) {
      const d = parseMysql(dateStr);
      return isNaN(d) ? '' : d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }
    function formatDateTime(dateStr) {
      const d = parseMysql(dateStr);
      return isNaN(d) ? dateStr : d.toLocaleString('en-US');
    }
    function capitalize(str) { if (!str) return ''; return str.charAt(0).toUpperCase() + str.slice(1); }
    function formatUserId(id) { const s = String(id ?? ''); return s.length > 15 ? s.slice(0, 12) + '...' : s; }
    function formatId(id) { return '#' + shortId(id, 12); }

    // ===== UI actions =====
    function toggleSidebar() {
      sidebarVisible = !sidebarVisible;
      document.getElementById('sidebar-overlay').classList.toggle('active');
    }

    async function showModalById(id) {
      try {
        const item = await apiOne(id);
        selectedAction = item;
        document.getElementById('modal-id').textContent = shortId(item.id, 18);
        document.getElementById('modal-overlay').classList.add('active');
        modalVisible = true;
        renderModal();
      } catch (e) {
        alert('Cannot load audit detail: ' + (e.message || e));
      }
    }

    function closeModal() {
      modalVisible = false;
      document.getElementById('modal-overlay').classList.remove('active');
    }

    async function applyFilters() {
      readFiltersFromUI();
      await loadData();
      toggleSidebar();
    }

    async function resetFilters() {
      document.getElementById('filter-action').value = '';
      document.getElementById('search-query').value = '';
      document.getElementById('specific-date').checked = true;
      document.getElementById('date-single').value = '';
      document.getElementById('date-from').value = '';
      document.getElementById('date-to').value = '';
      document.getElementById('date-single-section').style.display = 'block';
      document.getElementById('date-range-section').style.display = 'none';

      filterAction = '';
      searchQuery = '';
      specificDate = true;
      dateSingle = '';
      dateFrom = '';
      dateTo = '';

      await loadData();
      toggleSidebar();
    }

    function exportCSV() {
      const headers = ['ID', 'Type', 'Reason', 'User', 'Created At', 'Changes'];
      const rows = filteredActions.map(a => [
        a.id,
        a.type,
        a.reason || 'N/A',
        a.who || '',
        a.created_at || '',
        JSON.stringify(a.diff ?? {}, null, 0).replace(/"/g, '""')
      ]);
      const csvContent = [headers.join(','), ...rows.map(row => row.map(cell => `"${cell}"`).join(','))].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', `audit_trail_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function setActiveTab(tab) {
      activeTab = tab;
      document.getElementById('timeline-tab').classList.toggle('active', tab === 'timeline');
      document.getElementById('table-tab').classList.toggle('active', tab === 'table');
      document.getElementById('timeline-view').style.display = tab === 'timeline' ? 'block' : 'none';
      document.getElementById('table-view').style.display = tab === 'table' ? 'block' : 'none';
      renderContent();
    }

    // ===== Rendering =====
    function renderStats() {
      const s = getStats(filteredActions);
      document.getElementById('creates-count').textContent = s.creates;
      document.getElementById('updates-count').textContent = s.updates;
      document.getElementById('deletes-count').textContent = s.deletes;
      document.getElementById('total-count').textContent  = s.total;
    }

    function renderTimeline() {
      const timelineView = document.getElementById('timeline-view');
      if (!filteredActions.length) {
        timelineView.innerHTML = `<div class="empty" data-translate="No audit records">No audit records</div>`;
        return;
      }

      const grouped = groupByDate(filteredActions);
      let html = '';
      Object.keys(grouped).forEach(date => {
        html += `
          <div class="timeline-section">
            <div class="timeline-date">
              <span class="date-badge">${esc(formatDate(date))}</span>
            </div>
            <div class="timeline-items">
              ${grouped[date].map(action => `
                <div class="timeline-card type-${esc(action.type)}" data-id="${esc(action.id)}">
                  <div class="timeline-indicator">
                    <div class="indicator-dot ${esc(action.type)}"></div>
                    <div class="indicator-line"></div>
                  </div>
                  <div class="timeline-content">
                    <div class="timeline-header">
                      <div class="timeline-title">
                        <span
                          class="type-badge ${esc(action.type)}"
                          data-translate-dynamic="type"
                        >${esc(capitalize(action.type))}</span>
                        <span class="timeline-time">${esc(formatTime(action.created_at))}</span>
                      </div>
                      <button class="view-btn" type="button" data-id="${esc(action.id)}">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                          <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <span data-translate="View">View</span>
                      </button>
                    </div>
                    <div class="timeline-reason">${esc(action.reason || '')}</div>
                    <div class="timeline-meta">
                      <span class="meta-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                          <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        ${esc(formatUserId(action.who))}
                      </span>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });
      timelineView.innerHTML = html;
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      if (!filteredActions.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty" data-translate="No audit records">No audit records</td></tr>`;
        return;
      }
      tbody.innerHTML = filteredActions.map(action => `
        <tr>
          <td><span class="id-cell">${esc(formatId(action.id))}</span></td>
          <td><span class="type-badge ${esc(action.type)}" data-translate-dynamic="type">${esc(capitalize(action.type))}</span></td>
          <td><span class="reason-cell">${esc(action.reason || '')}</span></td>
          <td><span class="user-cell">${esc(formatUserId(action.who))}</span></td>
          <td><div class="timestamp-cell">${esc(formatDate(action.created_at))} <span class="time-small">${esc(formatTime(action.created_at))}</span></div></td>
          <td>
            <button class="action-btn" type="button" data-id="${esc(action.id)}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span data-translate="View Diff">View Diff</span>
            </button>
          </td>
        </tr>
      `).join('');
    }

    // ===== Helpers cho phần kế hoạch =====
    function _toArray(v){
      try { if (typeof v === 'string') return JSON.parse(v); } catch {}
      return Array.isArray(v) ? v : [];
    }
    const _norm = (s) => (s ?? '').toString().trim();
    const _isPlanLabel = (label='') =>
      /(^plan\s*#|\baction\s*plan|\bkế hoạch\b)/i.test(String(label||''));

    function _mapPlans(arr){
      return _toArray(arr)
        .filter(r => r && (_isPlanLabel(r.label) || r.plan_text || r.value))
        .map(r => ({
          plan_text: _norm(r.plan_text ?? r.value ?? ''),
          est_date : r.est_date ?? r.est ?? '',
          owner    : r.owner_name ?? r.owner ?? ''
        }))
        .filter(x => x.plan_text);
    }

    function extractPlansBeforeAfter(diff){
      let before = [], after = [];

      if (diff && typeof diff === 'object' && diff.plans){
        if (typeof diff.plans === 'object' && ('old' in diff.plans || 'new' in diff.plans)){
          before = _mapPlans(diff.plans.old);
          after  = _mapPlans(diff.plans.new);
          return { before, after };
        }
        if (Array.isArray(diff.plans)){
          after = _mapPlans(diff.plans);
          return { before, after };
        }
      }

      if (diff && typeof diff === 'object' && diff.short_form){
        if (typeof diff.short_form === 'object' && ('old' in diff.short_form || 'new' in diff.short_form)){
          before = _mapPlans(diff.short_form.old);
          after  = _mapPlans(diff.short_form.new);
          return { before, after };
        }
        if (Array.isArray(diff.short_form)){
          after = _mapPlans(diff.short_form);
          return { before, after };
        }
      }

      return { before, after };
    }

    function renderPlansTable(plans){
      if (!plans || !plans.length)
        return `<span class="status-badge add" data-translate="N/A">N/A</span>`;
      return `
        <div class="diff-section">
          <h4 class="section-title" data-translate="Action plans">Action plans</h4>
          <table class="diff-table" style="margin:0">
            <thead>
              <tr>
                <th style="width:56px">#</th>
                <th data-translate="Action plan">Action plan</th>
                <th data-translate="Planned completion date">Planned completion date</th>
                <th data-translate="Owner">Owner</th>
              </tr>
            </thead>
            <tbody>
              ${plans.map((p,i)=>`
                <tr>
                  <td>${i+1}</td>
                  <td>${esc(p.plan_text)}</td>
                  <td>${esc(p.est_date || '')}</td>
                  <td>${esc(p.owner || '')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderOnePlanTable(list, caption){
      const rows = (list && list.length) ? list.map((p,i)=>`
          <tr>
            <td>${i+1}</td>
            <td>${esc(p.plan_text)}</td>
            <td>${esc(p.est_date || '')}</td>
            <td>${esc(p.owner || '')}</td>
          </tr>
        `).join('') : `
          <tr>
            <td>1</td><td data-translate="N/A">N/A</td><td data-translate="N/A">N/A</td><td data-translate="N/A">N/A</td>
          </tr>
        `;

      return `
        <div class="diff-section">
          <h4 class="section-title">${esc(caption)}</h4>
          <table class="diff-table" style="margin:0">
            <thead>
              <tr>
                <th style="width:56px">#</th>
                <th data-translate="Action plan">Action plan</th>
                <th data-translate="Planned completion date">Planned completion date</th>
                <th data-translate="Owner">Owner</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderPlansTwoTables(plansBA){
      const { before=[], after=[] } = plansBA || {};
      return renderOnePlanTable(before, 'Before') + renderOnePlanTable(after, 'After');
    }

    function renderValue(v){
      if (v === null || v === undefined || v === '')
        return `<span class="status-badge add" data-translate="N/A">N/A</span>`;
      if (typeof v === 'object') {
        try { return `<pre class="diff-value" style="white-space:pre-wrap;margin:0">${esc(JSON.stringify(v, null, 2))}</pre>`; }
        catch { return `<span class="diff-value">${esc(String(v))}</span>`; }
      }
      return `<span class="diff-value">${esc(String(v))}</span>`;
    }

    // ===== Render modal detail =====
    function renderModal() {
      const modalBody = document.getElementById('modal-body');
      const a = selectedAction;
      if (!a) { modalBody.innerHTML = ''; return; }

      const diff   = a.diff || {};
      const media  = {};
      const normal = {};

      const HIDE_IN_FIELD_CHANGES = new Set(['plans', 'short_form', '__plan_snapshot']);

      Object.entries(diff).forEach(([k, v]) => {
        const kk = String(k || '').toLowerCase();
        if (HIDE_IN_FIELD_CHANGES.has(kk)) return;
        if (kk.includes('image') || kk.includes('video')) media[k] = v;
        else normal[k] = v;
      });

      const naBadge = () => `<span class="status-badge add" data-translate="N/A">N/A</span>`;
      const cell = (v) => (v === null || v === undefined || String(v).trim() === '') ? naBadge() : esc(String(v));
      const isPlanLabel = (s='') => /(^plan\s*#|\baction\s*plan|\bkế hoạch\b)/i.test(String(s||''));
      const toArray = (v) => { try { if (typeof v === 'string') return JSON.parse(v); } catch {} return Array.isArray(v) ? v : []; };
      const dateFromLabel = (label) => { const m = /\((\d{4}-\d{2}-\d{2})\)/.exec(String(label||'')); return m ? m[1] : ''; };
      const mapPlans = (arr) => toArray(arr)
        .filter(r => r && (isPlanLabel(r.label) || r.plan_text || r.value))
        .map(r => ({
          plan_text: String(r.plan_text ?? r.value ?? '').trim(),
          est_date : r.est_date ?? r.est ?? dateFromLabel(r.label),
          owner    : r.owner_name ?? r.owner ?? ''
        }))
        .filter(x => x.plan_text);

      function extractPlansBeforeAfter(d) {
        let before = [], after = [];
        if (d && typeof d === 'object' && d.plans !== undefined) {
          const p = d.plans;
          if (p && typeof p === 'object' && ('old' in p || 'new' in p)) {
            before = mapPlans(p.old);
            after  = mapPlans(p.new);
            return { before, after };
          }
          if (Array.isArray(p)) { after = mapPlans(p); return { before, after }; }
        }
        if (d && typeof d === 'object' && d.short_form !== undefined) {
          const sf = d.short_form;
          if (sf && typeof sf === 'object' && ('old' in sf || 'new' in sf)) {
            before = mapPlans(sf.old);
            after  = mapPlans(sf.new);
            return { before, after };
          }
          if (Array.isArray(sf)) { after = mapPlans(sf); return { before, after }; }
        }
        return { before, after };
      }

      function extractPlanSnapshot(d) {
        if (d && d.__plan_snapshot) return d.__plan_snapshot;

        const pickSide = (side, keyList) => {
          for (const k of keyList) {
            if (d && d[k] && typeof d[k] === 'object') {
              if (side === 'old' && 'old' in d[k]) return d[k].old;
              if (side === 'new' && 'new' in d[k]) return d[k].new;
            }
          }
          return undefined;
        };
        const oldObj = {
          plan_id  : pickSide('old', ['id','plan_id']),
          plan_code: pickSide('old', ['plan_code']),
          plan_text: pickSide('old', ['plan_text']),
          est_date : pickSide('old', ['est_date','due_date']),
          owner    : pickSide('old', ['owner_name','owner']),
        };
        const newObj = {
          plan_id  : pickSide('new', ['id','plan_id']),
          plan_code: pickSide('new', ['plan_code']),
          plan_text: pickSide('new', ['plan_text']),
          est_date : pickSide('new', ['est_date','due_date']),
          owner    : pickSide('new', ['owner_name','owner']),
        };
        const hasAny = (o) => Object.values(o).some(v => v !== undefined && v !== null && String(v) !== '');
        if (hasAny(oldObj) || hasAny(newObj)) return { old: oldObj, new: newObj };
        return null;
      }

      function renderCompactPlan(snapshot) {
        const pick = snapshot
          ? (snapshot.new && (snapshot.new.plan_text || snapshot.new.est_date || snapshot.new.owner)
              ? snapshot.new : snapshot.old)
          : null;

        const row = pick ? `
          <tr>
            <td>1</td>
            <td>${cell(pick.plan_text)}</td>
            <td>${cell(pick.est_date)}</td>
            <td>${cell(pick.owner)}</td>
          </tr>
        ` : `
          <tr>
            <td>1</td><td>${naBadge()}</td><td>${naBadge()}</td><td>${naBadge()}</td>
          </tr>
        `;

        return `
          <div class="diff-section">
            <h4 class="section-title" data-translate="Action plan">Action plan</h4>
            <table class="diff-table" style="margin:0">
              <thead>
                <tr>
                  <th style="width:56px">#</th>
                  <th data-translate="Action plan">Action plan</th>
                  <th data-translate="Planned completion date">Planned completion date</th>
                  <th data-translate="Owner">Owner</th>
                </tr>
              </thead>
              <tbody>${row}</tbody>
            </table>
          </div>
        `;
      }

      const isPlanEvent = /(device_action_plans:(?:status|update|delete)#\d+)/i.test(a.reason || '')
                          || (!!diff.__plan_snapshot);

      const plansBA   = extractPlansBeforeAfter(diff);
      const hasPlansBA = (plansBA.before && plansBA.before.length) || (plansBA.after && plansBA.after.length);

      const normalRowsFlat = [];
      for (const [key, val] of Object.entries(normal)) {
        const beforeHtml = (val && 'old' in val) ? renderValue(val.old) : naBadge();
        const afterHtml  = (val && 'new' in val) ? renderValue(val.new) : naBadge();
        normalRowsFlat.push([key, beforeHtml, afterHtml]);
      }

      const normalHtml = normalRowsFlat.length ? `
        <div class="diff-section">
          <h4 class="section-title" data-translate="Field Changes">Field Changes</h4>
          <table class="diff-table">
            <thead><tr><th data-translate="Field">Field</th><th data-translate="Before">Before</th><th data-translate="After">After</th></tr></thead>
            <tbody>
              ${normalRowsFlat.map(([field, beforeHtml, afterHtml]) => `
                <tr>
                  <td><strong>${esc(field)}</strong></td>
                  <td>${beforeHtml}</td>
                  <td>${afterHtml}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      ` : '';

      let plansHtml = '';
      if (isPlanEvent) {
        const snap = extractPlanSnapshot(diff);
        plansHtml = renderCompactPlan(snap);
      } else if (hasPlansBA) {
        const renderPlansTableOne = (list, caption) => {
          const hasRows = Array.isArray(list) && list.length > 0;
          const rows = hasRows
            ? list.map((p, i) => `
                <tr>
                  <td>${i + 1}</td>
                  <td>${cell(p.plan_text)}</td>
                  <td>${cell(p.est_date)}</td>
                  <td>${cell(p.owner)}</td>
                </tr>
              `).join('')
            : `
                <tr>
                  <td>1</td><td>${naBadge()}</td><td>${naBadge()}</td><td>${naBadge()}</td>
                </tr>
              `;
          return `
            <div class="diff-section">
              <h4 class="section-title">${esc(caption)}</h4>
              <table class="diff-table" style="margin:0">
                <thead>
                  <tr>
                    <th style="width:56px">#</th>
                    <th data-translate="Action plan">Action plan</th>
                    <th data-translate="Planned completion date">Planned completion date</th>
                    <th data-translate="Owner">Owner</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          `;
        };
        plansHtml = renderPlansTableOne(plansBA.before, 'Before') + renderPlansTableOne(plansBA.after, 'After');
      }

      const mediaHtml = Object.keys(media).length ? `
        <div class="diff-section">
          <h4 class="section-title" data-translate="Media Changes">Media Changes</h4>
        </div>
      ` : '';

      modalBody.innerHTML = `
        <div class="modal-info">
          <div class="info-item"><strong data-translate="Type">Type</strong>: <span class="type-badge ${esc(a.type)}" data-translate-dynamic="type">${esc((a.type||'').charAt(0).toUpperCase() + (a.type||'').slice(1))}</span></div>
          <div class="info-item"><strong data-translate="Reason">Reason</strong>: <span>${esc(a.reason || '')}</span></div>
          <div class="info-item"><strong data-translate="User">User</strong>: <span>${esc(a.who || '')}</span></div>
          <div class="info-item"><strong data-translate="Created">Created</strong>: <span>${esc(a.created_at || '')}</span></div>
        </div>

        ${plansHtml}
        ${normalHtml}
        ${mediaHtml}
      `;
    }

    function renderContent() {
      renderStats();
      if (activeTab === 'timeline') renderTimeline();
      else renderTable();
    }

    // ===== Events (delegation) =====
    document.addEventListener('click', (e) => {
      const viewBtn = e.target.closest('.view-btn');
      if (viewBtn) {
        const id = String(viewBtn.getAttribute('data-id'));
        showModalById(id);
        return;
      }
      const card = e.target.closest('.timeline-card');
      if (card && card.hasAttribute('data-id')) {
        const id = String(card.getAttribute('data-id'));
        showModalById(id);
      }
    });

    document.getElementById('table-body').addEventListener('click', (e) => {
      const btn = e.target.closest('.action-btn');
      if (!btn) return;
      const id = String(btn.getAttribute('data-id'));
      showModalById(id);
    });

    document.getElementById('specific-date').addEventListener('change', () => {
      specificDate = document.getElementById('specific-date').checked;
      document.getElementById('date-single-section').style.display = specificDate ? 'block' : 'none';
      document.getElementById('date-range-section').style.display = specificDate ? 'none' : 'block';
    });

    function normalize(items) {
      return items.map(a => {
        const ts = Date.parse(String(a.created_at || '').replace(' ', 'T'));
        return {
          ...a,
          _ts: isNaN(ts) ? 0 : ts,
          _dateKey: String(a.created_at || '').slice(0, 10),
          _dateStr: isNaN(ts) ? (a.created_at || '') : FMT_DATE.format(ts),
          _timeStr: isNaN(ts) ? '' : FMT_TIME.format(ts),
          _dateTimeStr: isNaN(ts) ? (a.created_at || '') : FMT_DATETIME.format(ts),
        };
      });
    }

    // ===== Data loader =====
    async function loadData() {
      try {
        document.getElementById('content-area').classList.add('loading');

        readFiltersFromUI();
        const { items } = await apiList(buildApiParamsFromFilters());
        actions = normalize(Array.isArray(items) ? items : []);
        actionMap = new Map(actions.map(a => [String(a.id), a]));

        filteredActions = clientFilter(actions)
          .sort((a, b) => b._ts - a._ts)
          .slice(0, MAX_RENDER);

        renderContent();
      } catch (e) {
        const timelineView = document.getElementById('timeline-view');
        timelineView.innerHTML = `<div class="empty">Failed to load data: ${esc(e.message || e)}</div>`;
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = `<tr><td colspan="6" class="empty" data-translate="Failed to load data">Failed to load data</td></tr>`;
        renderStats();
      } finally {
        document.getElementById('content-area').classList.remove('loading');
      }
    }

    // ===== Init =====
    document.getElementById('specific-date').checked = true;
    (async () => { await loadData(); })();

    // Topbar: clock + dropdown
    (function(){
      const dtEl = document.getElementById('datetime-display');
      if (dtEl){
        const fmt = new Intl.DateTimeFormat(undefined, {
          weekday:'short', year:'numeric', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit'
        });
        const tick = () => dtEl.textContent = fmt.format(new Date());
        tick(); setInterval(tick, 1000);
      }

      const btn  = document.getElementById('menu-button');
      const menu = document.getElementById('dropdown-menu');
      if (btn && menu){
        const close = () => { menu.classList.remove('show'); btn.setAttribute('aria-expanded','false'); };
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          const isOpen = menu.classList.toggle('show');
          btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        });
        document.addEventListener('click', (e)=>{
          if (!menu.contains(e.target) && e.target !== btn) close();
        });
        document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') close(); });
      }
    })();
  </script>
</body>

</html>
